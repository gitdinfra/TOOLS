<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case Converting Tool</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1322/1322164.png" type="image/png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base Dark Theme & Starry Background Styles */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            margin: 0;
            min-height: 100vh;
        }

        /* Animated Stars Container */
        #stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle var(--duration, 4s) ease-in-out infinite;
            animation-delay: var(--delay, 0s);
        }

        @keyframes twinkle {
            0% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 4px #fff; }
            100% { opacity: 0; transform: scale(0.5); }
        }

        /* Custom Scrollbar for Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: #111;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Toast Animation */
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .toast-enter {
            animation: slideInUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="relative flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">

    <!-- Star Background Element -->
    <div id="stars-container"></div>

    <!-- Main Content Wrapper -->
    <div class="relative z-10 w-full max-w-5xl mx-auto flex flex-col gap-8">
        
        <!-- Headers -->
        <div class="text-center space-y-4">
            <h1 class="text-3xl md:text-5xl font-bold tracking-tight text-white leading-tight max-w-4xl mx-auto">
                A simple tool to change character conversion.
            </h1>
            <p class="text-base md:text-lg text-gray-300">
                Simply enter your text and convert it to uppercase, lowercase, title case, and more.
            </p>
        </div>

        <!-- Main Input Area -->
        <div class="flex flex-col relative w-full rounded-xl border border-gray-700 bg-[#303030] shadow-2xl overflow-hidden focus-within:border-gray-500 transition-colors duration-300">
            <!-- Textarea -->
            <textarea id="main-input" 
                      class="w-full h-80 bg-[#303030] text-gray-100 placeholder-gray-500 p-6 pb-16 resize-none focus:outline-none text-lg"
                      placeholder="Type or paste your content here"></textarea>
            
            <!-- Bottom Toolbar inside Text Box -->
            <div class="absolute bottom-0 left-0 w-full p-3 flex flex-col sm:flex-row justify-between items-center bg-gradient-to-t from-[#303030] via-[#303030] to-transparent gap-4">
                
                <!-- Action Toolbar (Bottom-Left) -->
                <div class="flex items-center gap-2">
                    <button onclick="handleShare()" class="p-2 bg-gray-800 rounded hover:bg-gray-700 text-gray-300 transition-colors" title="Share">
                        <!-- Share Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                    </button>
                    <button onclick="handleDownload()" class="p-2 bg-gray-800 rounded hover:bg-gray-700 text-gray-300 transition-colors" title="Download as .txt">
                        <!-- Download Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                </div>

                <!-- Statistics Display (Bottom-Right) -->
                <div class="flex items-center gap-3 text-xs sm:text-sm font-medium text-gray-300 bg-gray-900/80 px-4 py-2 rounded-lg border border-gray-800">
                    <span id="stat-chars">Character Count: 0</span>
                    <span class="text-gray-600">|</span>
                    <span id="stat-words">Word Count: 0</span>
                    <span class="text-gray-600">|</span>
                    <span id="stat-lines">Line Count: 0</span>
                </div>
            </div>
        </div>

        <!-- Utility Action Buttons -->
        <div class="flex flex-wrap justify-center gap-3 md:gap-4">
            <button onclick="handleCopy()" class="flex items-center gap-2 bg-gray-800 border border-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-700 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                <span class="text-sm font-semibold">Copy</span>
            </button>
            <button onclick="handleCut()" class="flex items-center gap-2 bg-gray-800 border border-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-700 transition-colors group">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><line x1="20" y1="4" x2="8.12" y2="15.88"></line><line x1="14.47" y1="14.48" x2="20" y2="20"></line><line x1="8.12" y1="8.12" x2="12" y2="12"></line></svg>
                <span class="text-sm font-semibold">Cut</span>
            </button>
            <button onclick="handleClear()" class="flex items-center gap-2 bg-red-900/40 border border-red-800 px-5 py-2.5 rounded-lg hover:bg-red-900/60 transition-colors group text-red-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                <span class="text-sm font-semibold">Clear Texts</span>
            </button>
        </div>

        <!-- Conversion Action Buttons -->
        <div class="flex flex-wrap justify-center gap-3 md:gap-4">
            
            <button onclick="applyConversion('sentence')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center bg-orange-600 text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110">Sc</span>
                <span class="text-sm font-medium">Sentence case</span>
            </button>
            
            <button onclick="applyConversion('lower')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center bg-green-600 text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110">lc</span>
                <span class="text-sm font-medium">lower case</span>
            </button>
            
            <button onclick="applyConversion('upper')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center bg-blue-600 text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110">UC</span>
                <span class="text-sm font-medium">UPPER CASE</span>
            </button>
            
            <button onclick="applyConversion('capitalized')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center bg-purple-600 text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110">CC</span>
                <span class="text-sm font-medium">Capitalized Case</span>
            </button>
            
            <button onclick="applyConversion('alternating')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110" style="background-color: #6b8e23;">aC</span>
                <span class="text-sm font-medium">aLtErNaTiNg cAsE</span>
            </button>
            
            <button onclick="applyConversion('title')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center bg-teal-600 text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110">TC</span>
                <span class="text-sm font-medium">Title Case</span>
            </button>
            
            <button onclick="applyConversion('inverse')" class="flex items-center gap-3 bg-gray-900 border border-gray-800 p-2 pr-4 rounded-lg hover:bg-gray-800 transition-colors group">
                <span class="w-10 h-10 flex items-center justify-center text-white rounded-md font-bold text-lg shadow-inner group-hover:brightness-110" style="background-color: #d946ef;">iC</span>
                <span class="text-sm font-medium">InVeRsE CaSe</span>
            </button>

        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script>
        // DOM Elements
        const textArea = document.getElementById('main-input');
        const statChars = document.getElementById('stat-chars');
        const statWords = document.getElementById('stat-words');
        const statLines = document.getElementById('stat-lines');
        const toastContainer = document.getElementById('toast-container');

        // --- Animated Stars Logic ---
        function createStars() {
            const container = document.getElementById('stars-container');
            const numStars = 70; // Adjust for density
            for (let i = 0; i < numStars; i++) {
                const star = document.createElement('div');
                star.classList.add('star');
                
                // Random properties
                const size = Math.random() * 2 + 1; // 1px to 3px
                const posX = Math.random() * 100; // 0% to 100%
                const posY = Math.random() * 100;
                const delay = Math.random() * 5; // 0s to 5s delay
                const duration = Math.random() * 3 + 2; // 2s to 5s duration

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${posX}%`;
                star.style.top = `${posY}%`;
                star.style.setProperty('--delay', `${delay}s`);
                star.style.setProperty('--duration', `${duration}s`);

                container.appendChild(star);
            }
        }

        // Initialize background
        window.addEventListener('DOMContentLoaded', createStars);

        // --- Statistics Logic ---
        function updateStats() {
            const text = textArea.value;
            
            // Character count
            statChars.textContent = `Character Count: ${text.length}`;
            
            // Word count (filter out empty strings to avoid counting spaces as words)
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            statWords.textContent = `Word Count: ${words.length}`;
            
            // Line count
            const lines = text === '' ? 0 : text.split('\n').length;
            statLines.textContent = `Line Count: ${lines}`;
        }

        textArea.addEventListener('input', updateStats);

        // --- Conversion Logic ---
        const converters = {
            sentence: (str) => {
                // Capitalize first letter of the string and first letter after ., !, ?
                return str.toLowerCase().replace(/(^\s*\w|[\.\!\?]\s*\w)/g, c => c.toUpperCase());
            },
            lower: (str) => str.toLowerCase(),
            upper: (str) => str.toUpperCase(),
            capitalized: (str) => {
                // Capitalizes the first letter of EVERY word
                return str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
            },
            alternating: (str) => {
                // aLtErNaTiNg cAsE
                let result = '';
                for (let i = 0; i < str.length; i++) {
                    result += i % 2 === 0 ? str[i].toLowerCase() : str[i].toUpperCase();
                }
                return result;
            },
            title: (str) => {
                // Title Case: Capitalize all words except minor ones (a, an, the, etc.)
                const minorWords = /^(a|an|the|and|but|or|for|nor|on|at|to|from|by|over|in|of|with)$/i;
                return str.toLowerCase().replace(/\b\w+\b/g, (word, index) => {
                    if (index === 0 || !minorWords.test(word)) {
                        return word.charAt(0).toUpperCase() + word.slice(1);
                    }
                    return word;
                });
            },
            inverse: (str) => {
                // InVeRsE CaSe -> iNvErSe cAsE
                let result = '';
                for (let i = 0; i < str.length; i++) {
                    const char = str[i];
                    if (char >= 'a' && char <= 'z') {
                        result += char.toUpperCase();
                    } else if (char >= 'A' && char <= 'Z') {
                        result += char.toLowerCase();
                    } else {
                        result += char;
                    }
                }
                return result;
            }
        };

        function applyConversion(type) {
            const text = textArea.value;
            if (!text) return;
            
            if (converters[type]) {
                textArea.value = converters[type](text);
                updateStats(); // Update stats in case word/line counts change marginally (though rare)
                showToast(`Converted to ${type} case`);
            }
        }

        // --- Toolbar Actions ---
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast-enter flex items-center p-4 mb-2 text-sm text-white rounded-lg shadow-xl border ${isError ? 'bg-red-900 border-red-700' : 'bg-gray-800 border-gray-700'}`;
            toast.innerHTML = `
                <svg class="w-5 h-5 mr-3 ${isError ? 'text-red-400' : 'text-green-400'}" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/>
                </svg>
                <div>${message}</div>
            `;
            toastContainer.appendChild(toast);

            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function handleCopy() {
            if (!textArea.value) {
                showToast('Nothing to copy!', true);
                return;
            }
            // Using execCommand as per guidelines to bypass iframe restrictions
            textArea.select();
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('Text copied to clipboard');
                } else {
                    showToast('Failed to copy', true);
                }
            } catch (err) {
                showToast('Failed to copy', true);
            }
            // Clear selection
            window.getSelection().removeAllRanges();
        }

        function handleCut() {
            if (!textArea.value) {
                showToast('Nothing to cut!', true);
                return;
            }
            // Using execCommand as per guidelines to bypass iframe restrictions
            textArea.select();
            try {
                const successful = document.execCommand('cut');
                if (successful) {
                    showToast('Text cut to clipboard');
                    updateStats();
                } else {
                    showToast('Failed to cut', true);
                }
            } catch (err) {
                showToast('Failed to cut', true);
            }
            // Clear selection
            window.getSelection().removeAllRanges();
        }

        function handleShare() {
            if (!textArea.value) {
                showToast('Nothing to share!', true);
                return;
            }
            if (navigator.share) {
                navigator.share({
                    title: 'Converted Text',
                    text: textArea.value
                }).catch(err => {
                    console.log('Error sharing:', err);
                });
            } else {
                showToast('Sharing is not supported on this device/browser.', true);
            }
        }

        function handleDownload() {
            if (!textArea.value) {
                showToast('Nothing to download!', true);
                return;
            }
            const blob = new Blob([textArea.value], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'converted_text.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Download started');
        }

        function handleClear() {
            if (!textArea.value) return;
            textArea.value = '';
            updateStats();
            showToast('Text cleared');
        }

        function handleSettings() {
            showToast('Settings panel feature coming soon!', false);
        }
    </script>
</body>
</html>
